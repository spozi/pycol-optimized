name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify tag matches package version
        run: >-
          python -c 'import os, tomllib;
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"];
          tag = os.environ["GITHUB_REF_NAME"];
          assert tag == f"v{version}",
          f"tag {tag!r} does not match version {version!r}"'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate source
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pycol-optimized
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
