[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycol-optimized"
version = "0.2.0"
description = "Float32 PyTorch acceleration for selected PyCOL data-complexity metrics"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Muhammad Syafiq Mohd Pozi" }]
keywords = [
  "data-complexity",
  "class-overlap",
  "imbalanced-learning",
  "pytorch",
  "mps",
  "cuda",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.2,<3",
  "torch>=2.13,<3",
]

[project.urls]
Homepage = "https://github.com/spozi/pycol-optimized"
Repository = "https://github.com/spozi/pycol-optimized"
Issues = "https://github.com/spozi/pycol-optimized/issues"
Changelog = "https://github.com/spozi/pycol-optimized/blob/main/CHANGELOG.md"

[project.optional-dependencies]
reference = [
  "scipy>=1.15,<2",
  "pycol-complexity==1.0.4",
]
test = [
  "pytest>=8.3,<10",
]
dev = [
  "scipy>=1.15,<2",
  "pycol-complexity==1.0.4",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "build>=1.2,<2",
  "twine>=5,<7",
  "check-wheel-contents>=0.6,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycol_optimized = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
